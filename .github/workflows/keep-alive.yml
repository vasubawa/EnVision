name: Keep database active

on:
  schedule:
    # A few real database reads across the day. Hobby cron can only add one more.
    - cron: '15 2,10,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep-alive
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add APP_URL and CRON_SECRET repository secrets. APP_URL is the production origin, without a trailing slash."
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/keep-alive"
