name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        # Dependabot PRs may have an out-of-sync lockfile if pnpm couldn't
        # regenerate it cleanly. Fall back to a normal install so the lockfile
        # is refreshed rather than failing the whole build.
        run: |
          if pnpm install --frozen-lockfile 2>/dev/null; then
            echo "Installed with frozen lockfile."
          else
            echo "::warning::Frozen lockfile install failed — falling back to pnpm install. The lockfile will be out of date until the next commit."
            pnpm install
          fi
        env:
          HUSKY: '0'

      - name: Run checks
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          GROQ_API_KEY: placeholder
          OPENROUTER_API_KEY: placeholder
          NVIDIA_NIM_API_KEY: placeholder
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
          TURNSTILE_SECRET_KEY: placeholder
          CRON_SECRET: placeholder-cron-secret
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder-upstash-token
