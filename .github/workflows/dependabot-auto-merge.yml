# Best-effort auto-merge for Dependabot. CI remains the real gate.
# Do not install/build/push here — that fails under Dependabot's token
# and turns every PR red even when CI is green.

name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Skip majors — those need a human look.
      # Soft-fail: missing "Allow auto-merge" or token limits must not red-X the PR.
      - name: Enable auto-merge (non-major)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out="$(gh pr merge --auto --squash "$PR_URL" 2>&1)"
          status=$?
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not enable auto-merge (exit $status). Enable Settings → General → Allow auto-merge, or merge manually once CI is green."
          fi
          exit 0
