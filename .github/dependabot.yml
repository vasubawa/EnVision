version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 25
    commit-message:
      prefix: 'chore(deps)'
    # Keep lockfile in sync with package.json
    versioning-strategy: increase
    # Rebase and push new commits to existing open PRs
    rebase-strategy: auto
    # Block breaking majors that lack ecosystem support (TS 7 rewritten in Go breaks typescript-eslint, ESLint 10 breaks eslint-config-next)
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    # Group all npm updates into one PR
    groups:
      all-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    rebase-strategy: auto
    # Group all Actions updates into one PR
    groups:
      all-actions:
        patterns:
          - '*'
